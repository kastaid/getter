name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  linter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-dev.txt
      - run: |
          uv pip install --system -r requirements.txt
          if [ -f requirements-dev.txt ]; then uv pip install --system -r requirements-dev.txt; fi
      - run: python3 -m run --lint
      - uses: illvart/beautysh-action@latest
        with:
          args: '*.sh --indent-size 2 &>/dev/null'
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'ci: apply auto-fixes'
          commit_options: '--no-verify'
          commit_user_name: ${{ github.repository_owner }}
          commit_user_email: ${{ github.repository_owner }}@users.noreply.github.com
